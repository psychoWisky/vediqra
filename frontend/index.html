<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VEDIQRA - personalised gifts and custom-printed products.">
    <meta name="theme-color" content="#D4AF5A">
    <meta name="robots" content="index, follow">
    <!-- og:url, og:image and <link rel="canonical"> are intentionally omitted: they require the final
         production domain (WEBSITE_URL), which has not been confirmed. Add them once that's known. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VEDIQRA">
    <meta property="og:title" content="VEDIQRA">
    <meta property="og:description" content="VEDIQRA - personalised gifts and custom-printed products.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VEDIQRA">
    <meta name="twitter:description" content="VEDIQRA - personalised gifts and custom-printed products.">
    <title>VEDIQRA</title>
    <!-- First-paint theme for the storefront (the admin panel at /admin stays light). Layout.tsx keeps the
         class in sync afterwards for client-side navigation between storefront and admin. -->
    <script>(function(){if(!/^\/admin\/?$/i.test(location.pathname)){document.documentElement.classList.add('theme-dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0B0B0B')}})()</script>
    <style>html.theme-dark{background:#0B0B0B;color-scheme:dark}</style>
  </head>
  <body>
    <!-- Meta Pixel (if configured) is loaded from src/utils/metaPixel.ts, initialised once VITE_META_PIXEL_ID
         is set. No pixel ID is hardcoded here, so no tracking request is ever made until one is configured. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
